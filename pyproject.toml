[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genfin_ecology"
version = "1.0.0"
description = "GenFinEcology — feature-ablation ecology for generative financial text (belief, detectability, multi-round contamination)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hossein Tabasi" }]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
app = ["streamlit>=1.28.0"]

[project.scripts]
genfin_ecology = "genfin_ecology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
